<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ruina Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #00ff88; --bg: #0a0a0c; --card: #16161a; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); }
        .balance-box { display: flex; gap: 10px; }
        .balance { background: var(--card); padding: 8px 15px; border-radius: 12px; border: 1px solid #333; font-weight: bold; }
        
        .game-container { padding: 20px; display: none; }
        .game-active { display: block; }
        
        /* Меню выбора игр */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .game-card { 
            background: var(--card); border-radius: 20px; padding: 20px; text-align: center;
            border: 1px solid #222; transition: 0.3s; cursor: pointer;
        }
        .game-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .game-card i { font-size: 40px; display: block; margin-bottom: 10px; }

        /* Crash UI */
        #crash-chart { width: 100%; height: 200px; background: #000; border-radius: 15px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .multiplier { font-size: 48px; font-weight: 900; color: var(--accent); }

        /* Mines UI */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 20px; }
        .cell { width: 100%; aspect-ratio: 1; background: #222; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .cell.open { background: var(--accent); color: #000; }
        .cell.bomb { background: #ff3366; }

        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: #000; }
        
        .back-btn { background: none; color: #777; border: none; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-menu">
    <div class="header">
        <div style="font-weight: 900; letter-spacing: 1px;">RUINA <span style="color:var(--accent)">CASINO</span></div>
        <div class="balance-box">
            <div class="balance" style="color:#ffcc00">⭐ <span id="stars-val">...</span></div>
            <div class="balance" style="color:#0088cc">💎 <span id="ton-val">...</span></div>
        </div>
    </div>

    <div class="menu-grid">
        <div class="game-card" onclick="openGame('crash')"><i>🚀</i><b>CRASH</b><br><small>До x100.00</small></div>
        <div class="game-card" onclick="openGame('mines')"><i>💣</i><b>MINES</b><br><small>Найди алмазы</small></div>
        <div class="game-card"><i>🎡</i><b>WHEEL</b><br><small>Скоро</small></div>
        <div class="game-card"><i>🎾</i><b>PLINKO</b><br><small>Скоро</small></div>
    </div>
</div>

<div id="game-crash" class="game-container">
    <button class="back-btn" onclick="closeGame()">← Назад</button>
    <div id="crash-chart">
        <div class="multiplier" id="crash-mult">1.00x</div>
    </div>
    <div style="margin-top:20px">
        Ставка: 10 Stars
        <button id="crash-btn" class="btn btn-primary" onclick="startCrash()">ИГРАТЬ</button>
    </div>
</div>

<div id="game-mines" class="game-container">
    <button class="back-btn" onclick="closeGame()">← Назад</button>
    <div style="text-align:center">Множитель: <span id="mines-mult" style="color:var(--accent)">1.00x</span></div>
    <div class="mines-grid" id="mines-board"></div>
    <button id="mines-btn" class="btn btn-primary" onclick="startMines()">НАЧАТЬ ИГРУ (0.1 TON)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id');
    const API_URL = 'http://ТВОЙ_IP_СЕРВЕРА:8080'; // Замени на IP где запущен бот

    let balance = { stars: 0, ton: 0 };

    async function loadBalance() {
        const r = await fetch(`${API_URL}/api/balance?user_id=${userId}`);
        balance = await r.json();
        document.getElementById('stars-val').innerText = balance.stars.toFixed(1);
        document.getElementById('ton-val').innerText = balance.ton.toFixed(2);
    }

    async function saveBalance() {
        await fetch(`${API_URL}/api/update`, {
            method: 'POST',
            body: JSON.stringify({ ...balance, user_id: userId })
        });
    }

    function openGame(id) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-' + id).classList.add('game-active');
    }

    function closeGame() {
        location.reload(); // Простой сброс состояний
    }

    // --- ЛОГИКА CRASH ---
    let crashInterval;
    function startCrash() {
        if (balance.stars < 10) return alert("Мало Stars!");
        balance.stars -= 10;
        document.getElementById('crash-btn').disabled = true;
        let m = 1.0;
        let crashPoint = (Math.random() * 5 + 1).toFixed(2);
        
        crashInterval = setInterval(() => {
            m += 0.01;
            document.getElementById('crash-mult').innerText = m.toFixed(2) + 'x';
            
            if (m >= crashPoint) {
                clearInterval(crashInterval);
                document.getElementById('crash-mult').style.color = '#ff3366';
                document.getElementById('crash-mult').innerText = 'BOOM!';
                setTimeout(closeGame, 2000);
            }
        }, 50);
        
        document.getElementById('crash-btn').innerText = "ЗАБРАТЬ";
        document.getElementById('crash-btn').onclick = () => {
            clearInterval(crashInterval);
            let win = 10 * m;
            balance.stars += win;
            alert("Выигрыш: " + win.toFixed(1));
            saveBalance();
            closeGame();
        };
        document.getElementById('crash-btn').disabled = false;
    }

    // --- ЛОГИКА MINES ---
    let minesActive = false;
    let bombs = [];
    let currentMinesMult = 1.0;

    function startMines() {
        if (balance.ton < 0.1) return alert("Нужно 0.1 TON!");
        balance.ton -= 0.1;
        minesActive = true;
        bombs = Array.from({length: 25}, (_, i) => i).sort(() => Math.random() - 0.5).slice(0, 5);
        
        const board = document.getElementById('mines-board');
        board.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => clickCell(i, cell);
            board.appendChild(cell);
        }
        document.getElementById('mines-btn').innerText = "ЗАБРАТЬ ВЫИГРЫШ";
        document.getElementById('mines-btn').onclick = cashoutMines;
        saveBalance();
    }

    function clickCell(i, el) {
        if (!minesActive || el.classList.contains('open')) return;
        if (bombs.includes(i)) {
            el.innerHTML = '💣'; el.classList.add('bomb');
            minesActive = false;
            alert("БОМБА! Вы проиграли.");
            setTimeout(closeGame, 1000);
        } else {
            el.innerHTML = '💎'; el.classList.add('open');
            currentMinesMult += 0.2;
            document.getElementById('mines-mult').innerText = currentMinesMult.toFixed(2) + 'x';
        }
    }

    function cashoutMines() {
        let win = 0.1 * currentMinesMult;
        balance.ton += win;
        alert("Забрали: " + win.toFixed(2) + " TON");
        saveBalance();
        closeGame();
    }

    loadBalance();
</script>
</body>
</html>
