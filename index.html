<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruina Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #050505; --card: #121216; --accent: #00ff88; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Header */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .balance-group { display: flex; gap: 8px; }
        .bal { background: var(--card); padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #333; }

        /* Banner */
        .banner { margin: 15px; background: linear-gradient(90deg, #1d4d30, #0a1f12); border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #2e5a3c; }

        /* Grid */
        .section-title { padding: 0 15px; font-size: 18px; font-weight: 900; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px 100px 15px; }
        .card { background: var(--card); border-radius: 18px; padding: 15px; text-align: center; border: 1px solid #222; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 60px; height: 60px; margin-bottom: 10px; }
        .card b { display: block; text-transform: uppercase; letter-spacing: 1px; }
        .card small { color: #666; font-size: 11px; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #0a0a0a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { color: #555; text-align: center; font-size: 10px; text-decoration: none; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* Game Overlays */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: none; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div style="font-weight: bold;">UQB6Azh...Eh</div>
            <div class="balance-group">
                <div class="bal" style="color:#0088cc">💎 <span id="ton-ui">0.1</span></div>
                <div class="bal" style="color:#ffcc00">⭐ <span id="stars-ui">10</span></div>
            </div>
        </div>

        <div class="banner">
            <b style="color: var(--accent);">НОВЫЙ КЕЙС</b><br>
            <span style="font-size: 22px; font-weight: 900;">КЭШБЭК 10%</span>
        </div>

        <div class="section-title">ИГРЫ</div>
        <div class="grid">
            <div class="card" onclick="showGame('crash')">
                <img src="https://cdn-icons-png.flaticon.com/512/1042/1042582.png">
                <b>CRASH</b><br><small>5 играют</small>
            </div>
            <div class="card" onclick="showGame('cases')">
                <img src="https://cdn-icons-png.flaticon.com/512/679/679927.png">
                <b>КЕЙСЫ</b><br><small>12 играют</small>
            </div>
            <div class="card" onclick="showGame('mines')">
                <img src="https://cdn-icons-png.flaticon.com/512/241/241857.png">
                <b>МИНЫ</b><br><small>3 играют</small>
            </div>
            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/811/811440.png">
                <b>КОЛЕСО</b><br><small>Скоро</small>
            </div>
        </div>

        <nav class="nav">
            <div class="nav-item active"><div class="nav-icon">🏠</div>МАРКЕТ</div>
            <div class="nav-item"><div class="nav-icon">🏆</div>ЛИДЕРЫ</div>
            <div class="nav-item"><div class="nav-icon">🎮</div>ИГРЫ</div>
            <div class="nav-item"><div class="nav-icon">👤</div>ПРОФИЛЬ</div>
        </nav>
    </div>

    <div id="game-crash" class="overlay">
        <button onclick="hideGame('crash')" style="background:none; color:#fff; border:1px solid #333; padding:5px 15px; border-radius:10px;">← Назад</button>
        <div style="text-align:center; margin-top:50px;">
            <h1 id="multiplier" style="font-size: 60px; color: var(--accent);">1.00x</h1>
            <p>Ставка: 10 Stars</p>
            <button id="btn-crash" onclick="playCrash()" style="background:var(--accent); color:#000; width:100%; padding:20px; border-radius:15px; font-weight:bold; border:none;">ИГРАТЬ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = new URLSearchParams(window.location.search).get('user_id');
        const API = 'http://ТВОЙ_IP_СЕРВЕРА:8080'; // Сюда IP сервера с Python

        let balance = { stars: 10, ton: 0.1 };

        async function sync() {
            const r = await fetch(`${API}/api/user?user_id=${userId}`);
            balance = await r.json();
            document.getElementById('stars-ui').innerText = balance.stars.toFixed(1);
            document.getElementById('ton-ui').innerText = balance.ton.toFixed(2);
        }

        async function save() {
            await fetch(`${API}/api/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({...balance, user_id: userId})
            });
            sync();
        }

        function showGame(id) { document.getElementById('game-'+id).style.display = 'block'; }
        function hideGame(id) { document.getElementById('game-'+id).style.display = 'none'; }

        function playCrash() {
            if (balance.stars < 10) return alert("Мало Stars!");
            balance.stars -= 10;
            save();
            let m = 1.0;
            let crash = (Math.random() * 3 + 1.1).toFixed(2);
            let btn = document.getElementById('btn-crash');
            btn.disabled = true;

            let timer = setInterval(() => {
                m += 0.01;
                document.getElementById('multiplier').innerText = m.toFixed(2) + 'x';
                if (m >= crash) {
                    clearInterval(timer);
                    document.getElementById('multiplier').style.color = 'red';
                    alert("BOOM!");
                    location.reload();
                }
            }, 50);

            btn.disabled = false;
            btn.innerText = "ЗАБРАТЬ";
            btn.onclick = () => {
                clearInterval(timer);
                let win = 10 * m;
                balance.stars += win;
                alert(`Выигрыш: ${win.toFixed(1)} Stars!`);
                save();
                location.reload();
            };
        }

        sync();
    </script>
</body>
</html>
